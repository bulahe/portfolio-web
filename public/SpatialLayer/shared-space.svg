    <text x="73" y="844" fill="#B4ADC9" font-size="20">Import</text><text x="283" y="844" fill="#B4ADC9" font-size="20">Place</text><text x="493" y="844" fill="#B4ADC9" font-size="20">Save</text><text x="703" y="844" fill="#B4ADC9" font-size="20">Revisit</text>
    <text x="1126" y="844" text-anchor="end" fill="#76738F" font-size="16">SYSTEM SKETCH / 2026</text>
  </g>
</svg>
